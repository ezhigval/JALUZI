name: piter-jaluzi

services:
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.21
    restart: unless-stopped
    networks:
      - backend
    # UI only on loopback — open via SSH tunnel: ssh -L 8025:127.0.0.1:8025 jaluzi-vm
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    # SMTP stays internal (mailpit:1025). No public publish.

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      PROCESS_ROLE: api
      STORAGE_DIR: /var/data/jaluzi
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
    volumes:
      - jaluzi-data:/var/data/jaluzi
    restart: unless-stopped
    networks:
      - frontend
      - backend
    expose:
      - "3001"
    depends_on:
      - mailpit
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PROCESS_ROLE: worker
      STORAGE_DIR: /var/data/jaluzi
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
    volumes:
      - jaluzi-data:/var/data/jaluzi
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        SITE_URL: ${SITE_URL:-https://piter-jaluzi.ru}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-info@piter-jaluzi.ru}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend

networks:
  frontend:
  backend:

volumes:
  jaluzi-data:
  caddy-data:
  caddy-config:
